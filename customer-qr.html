<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A.Keopi Cafe - Customer QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    @media print {
      body { background: white !important; }
      .no-print { display: none !important; }
      .qr-card { box-shadow: none !important; border: 2px solid #133824 !important; }
    }
  </style>
</head>
<body class="min-h-screen bg-[#F6EDE0] p-4 text-[#421E0E] sm:p-8">
  <main class="mx-auto flex max-w-md flex-col items-center">
    <section class="qr-card w-full rounded-3xl border border-[#EBCFAD] bg-white p-6 text-center shadow-xl">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#133824] text-3xl text-white">☕</div>
      <h1 class="font-serif text-2xl font-extrabold text-[#133824]">A.Keopi Cafe</h1>
      <p class="mt-1 text-sm font-bold text-stone-500">Scan to Order</p>

      <div class="mx-auto mt-5 flex aspect-square w-full max-w-[320px] items-center justify-center rounded-2xl border-4 border-[#133824] bg-white p-3">
        <canvas id="qr-code" class="h-full w-full" aria-label="QR code for A.Keopi Cafe customer ordering"></canvas>
      </div>

      <p class="mt-5 text-sm font-extrabold">Piliin ang menu at mag-place ng order</p>
      <p class="mt-1 break-all text-xs text-stone-500">https://chrisromiltugade-png.github.io/A.keopicafe/customer.html</p>
    </section>

    <div class="no-print mt-4 flex w-full gap-2">
      <button type="button" onclick="downloadQr()" class="flex-1 rounded-xl border border-[#133824] bg-white px-4 py-3 text-sm font-extrabold text-[#133824]">Download QR</button>
      <button type="button" onclick="window.print()" class="flex-1 rounded-xl bg-[#133824] px-4 py-3 text-sm font-extrabold text-white">Print QR</button>
    </div>
  </main>

  <script>
    const customerUrl = 'https://chrisromiltugade-png.github.io/A.keopicafe/customer.html';
    const qr = new QRious({
      element: document.getElementById('qr-code'),
      value: customerUrl,
      size: 1000,
      level: 'H',
      foreground: '#133824',
      background: '#FFFFFF'
    });

    function downloadQr() {
      const link = document.createElement('a');
      link.download = 'A-Keopi-Cafe-Customer-QR.png';
      link.href = qr.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
