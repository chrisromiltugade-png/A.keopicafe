<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A.Keopi Cafe - Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <style>
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { overflow-wrap: break-word; }
    #menu-list, #cart-items, #variant-list, #addon-list, #toast { overflow-wrap: anywhere; }
  </style>
</head>
<body class="bg-[#FFFDF8] text-[#2F2A21]">
  <main class="mx-auto min-h-screen max-w-3xl p-3 pb-32 sm:p-5">
    <header class="mb-4 flex items-center gap-3 rounded-2xl border border-[#D8B55A] bg-black p-4 text-white shadow-lg">
      <div class="flex h-11 w-11 shrink-0 items-center justify-center overflow-hidden rounded-xl border border-[#D8B55A] bg-white p-1">
        <img src="./A-keopicafe-logo.jpg" alt="A.Keopi Cafe logo" class="h-full w-full object-contain">
      </div>
      <div>
        <h1 class="font-serif text-xl font-extrabold break-words">A.Keopi Cafe</h1>
        <p class="text-xs font-semibold text-[#D8B55A]">Customer Ordering</p>
      </div>
    </header>

    <div id="store-hours-banner" class="mb-3 rounded-2xl border px-4 py-3 text-center">
      <p id="store-status" class="text-sm font-extrabold"></p>
      <p id="store-hours-text" class="mt-0.5 text-xs text-stone-500">Open daily: 10:00 AM – 10:00 PM</p>
      <a
        href="https://www.google.com/maps/search/?api=1&query=Beside%20RAMDC%20Concordia%20along%20highway%2C%20Bolinao%2C%20Pangasinan%2C%20Philippines%202406"
        target="_blank"
        rel="noopener"
        class="mt-2 inline-block text-xs font-bold text-[#A77D1D] underline"
      >
        📍 Beside RAMDC Concordia along highway, Bolinao, Pangasinan, Philippines, 2406
      </a>
    </div>

    <section class="mb-3 rounded-2xl bg-white p-3 shadow">
      <div class="grid gap-3 sm:grid-cols-2">
        <label class="block text-xs font-extrabold">Customer Name *
          <input id="customer-name" class="mt-1 w-full rounded-xl border border-stone-300 px-3 py-2.5 text-sm outline-none focus:border-[#C9A84D] focus:ring-2 focus:ring-[#C9A84D]/30" placeholder="Enter your name" autocomplete="name">
        </label>
      </div>
      <fieldset class="mt-3">
        <legend class="mb-1 text-xs font-extrabold">Order Type *</legend>
        <div class="grid grid-cols-2 gap-2">
          <label class="flex cursor-pointer items-center gap-2 rounded-xl border border-stone-300 px-3 py-2.5 text-sm font-bold">
            <input id="order-dinein" type="radio" name="order-type" value="Dine-In" checked onchange="setOrderType('Dine-In')" class="accent-[#C9A84D]">
            <span>🍽️ Dine-In</span>
          </label>
          <label class="flex cursor-pointer items-center gap-2 rounded-xl border border-stone-300 px-3 py-2.5 text-sm font-bold">
            <input id="order-takeout" type="radio" name="order-type" value="Take-Out" onchange="setOrderType('Take-Out')" class="accent-[#C9A84D]">
            <span>🛍️ Take-Out</span>
          </label>
        </div>
      </fieldset>
    </section>

    <section class="mb-3 rounded-2xl bg-white p-3 shadow">
      <label for="menu-search" class="block text-xs font-extrabold">Search Menu
        <input id="menu-search" type="search" oninput="setMenuSearch(this.value)" class="mt-1 w-full rounded-xl border border-stone-300 px-3 py-2.5 text-sm outline-none focus:border-[#C9A84D] focus:ring-2 focus:ring-[#C9A84D]/30" placeholder="Search drinks, meals, snacks..." autocomplete="off">
      </label>
      <nav id="menu-categories" class="mt-3 flex gap-2 overflow-x-auto pb-1" aria-label="Menu categories"></nav>
    </section>
    <section id="menu-list" class="space-y-5"></section>
  </main>

  <aside class="fixed inset-x-0 bottom-0 z-40 border-t border-stone-200 bg-white p-3 shadow-[0_-8px_30px_rgba(0,0,0,.12)]">
    <div class="mx-auto flex max-w-3xl items-center gap-3">
      <div class="min-w-0 flex-1">
        <p class="text-xs text-stone-500"><span id="cart-count">0</span> item(s)</p>
        <p class="text-lg font-extrabold text-[#133824]">₱<span id="cart-total">0.00</span></p>
      </div>
      <button id="cart-toggle" type="button" onclick="toggleCart()" class="rounded-xl border border-stone-300 px-4 py-3 text-sm font-bold">View Order</button>
      <button id="place-order" type="button" onclick="placeOrder()" class="rounded-xl border border-[#C9A84D] bg-[#C9A84D] px-5 py-3 text-sm font-extrabold text-white disabled:opacity-40" disabled>Place Order</button>
    </div>
  </aside>

  <div id="cart-panel" class="fixed inset-0 z-50 hidden items-end bg-black/50">
    <div class="max-h-[75vh] w-full overflow-y-auto rounded-t-3xl bg-white p-4">
      <div class="mb-3 flex items-center justify-between">
        <h2 class="font-extrabold">Your Order</h2>
        <button type="button" onclick="toggleCart(false)" class="rounded-lg px-3 py-2 text-sm">Close</button>
      </div>
      <div id="cart-items" class="space-y-2"></div>
      <label for="payment-method" class="mt-4 block text-xs font-extrabold">Payment Method <span class="font-normal text-stone-500">(Optional)</span>
        <select id="payment-method" class="mt-1 w-full rounded-xl border border-stone-300 bg-white px-3 py-2.5 text-sm outline-none focus:border-[#C9A84D] focus:ring-2 focus:ring-[#C9A84D]/30">
          <option value="">Choose later / Not selected</option>
          <option value="Cash">Cash</option>
          <option value="GCash">GCash</option>
          <option value="Maya">Maya</option>
        </select>
      </label>
    </div>
  </div>

  <div id="item-modal" class="fixed inset-0 z-[60] hidden items-end bg-black/50 sm:items-center sm:justify-center sm:p-4">
    <div class="max-h-[85vh] w-full max-w-md overflow-y-auto rounded-t-3xl bg-white p-4 sm:rounded-3xl">
      <div class="mb-3 flex items-start justify-between gap-2">
        <div class="min-w-0">
          <p id="item-category" class="text-[10px] font-bold uppercase text-[#1C4B32] break-words"></p>
          <h2 id="item-name" class="font-extrabold break-words"></h2>
          <p id="item-description" class="mt-1 text-xs leading-snug text-stone-500 break-words"></p>
        </div>
        <button type="button" onclick="closeItemModal()" class="shrink-0 rounded-lg px-3 py-2">×</button>
      </div>
      <div id="variant-list" class="space-y-2"></div>
      <div id="addon-list" class="mt-4 space-y-2"></div>
      <button id="add-item-button" type="button" onclick="addSelectedItem()" class="mt-4 w-full rounded-xl border border-[#C9A84D] bg-[#C9A84D] py-3 text-sm font-extrabold text-white">Add to Order</button>
    </div>
  </div>

  <div id="order-confirmation" class="fixed inset-0 z-[65] hidden items-center justify-center bg-black/60 p-4">
    <section class="w-full max-w-sm rounded-2xl bg-white p-6 text-center shadow-xl">
      <p class="text-sm font-bold text-[#1C4B32]">Order sent!</p>
      <h2 class="mt-1 text-xl font-extrabold">Your order code</h2>
      <p id="order-confirmation-code" class="my-4 rounded-xl bg-[#FFF9E8] py-4 font-mono text-4xl font-extrabold tracking-widest text-[#7A5A12]"></p>
      <p class="text-sm text-stone-600">Ibigay o ipakita ang code na ito sa cashier para makuha ang order mo.</p>
      <button type="button" onclick="closeOrderConfirmation()" class="mt-5 w-full rounded-xl bg-[#133824] py-3 text-sm font-extrabold text-white">Done</button>
    </section>
  </div>

  <div id="toast" class="fixed left-1/2 top-4 z-[70] hidden max-w-[90vw] -translate-x-1/2 rounded-xl border border-[#C9A84D] bg-[#7A5A12] px-4 py-2.5 text-center text-sm font-bold text-white shadow-lg break-words"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCKyxAyc7wrDRCDhMrOKT50JYq4zj_wZow",
      authDomain: "akeopicafe-order.firebaseapp.com",
      projectId: "akeopicafe-order",
      storageBucket: "akeopicafe-order.firebasestorage.app",
      messagingSenderId: "43301188783",
      appId: "1:43301188783:web:483fadd21a8c7d7e99905a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    firebase.auth().signInAnonymously().catch((error) => console.error(error));

    const PREMIUM_COOKIES = [
      {
        id: 'ck-redvelvet',
        category: 'Premium Cookies',
        name: 'Red Velvet',
        description: 'Classic red velvet cookie with a rich cocoa flavor, creamy white chocolate, and a soft, chewy center.',
        variants: [{ label: 'Medium (70g)', price: 75 }, { label: 'Large (100g)', price: 115 }],
        addons: [],
        available: true
      },
      {
        id: 'ck-doublechocolate',
        category: 'Premium Cookies',
        name: 'Double Chocolate',
        description: 'Rich, fudgy chocolate cookie loaded with dark chocolate chips and indulgent milk chocolate chunks.',
        variants: [{ label: 'Medium (70g)', price: 75 }, { label: 'Large (100g)', price: 115 }],
        addons: [],
        available: true
      },
      {
        id: 'ck-biscoffchunk',
        category: 'Premium Cookies',
        name: 'Biscoff Chunk Overload',
        description: 'Crunchy Biscoff cookie pieces loaded with chocolate chunks, rich Biscoff spread, and extra Biscoff on top.',
        variants: [{ label: 'Medium (70g)', price: 75 }, { label: 'Large (100g)', price: 115 }],
        addons: [],
        available: true
      },
      {
        id: 'ck-chocolatechipog',
        category: 'Premium Cookies',
        name: 'Chocolate Chip OG',
        description: 'Loaded with premium Callebaut chocolate chips, perfectly crunchy on the outside with a soft, chewy center.',
        variants: [{ label: 'Medium (70g)', price: 75 }, { label: 'Large (100g)', price: 115 }],
        addons: [],
        available: true
      },
      {
        id: 'ck-campfiresmores',
        category: 'Premium Cookies',
        name: 'Campfire Smores',
        description: 'Loaded with crunchy grahams, gooey marshmallows, and rich chocolate for the perfect campfire-inspired bite.',
        variants: [{ label: 'Medium (70g)', price: 75 }, { label: 'Large (100g)', price: 115 }],
        addons: [],
        available: true
      },
      {
        id: 'ck-dubai',
        category: 'Premium Cookies',
        name: 'Dubai',
        description: 'Dubai-style cookie loaded with pistachio cream and crispy kataifi, finished with a rich chocolate coating.',
        variants: [{ label: 'Large (100g)', price: 115 }],
        addons: [],
        available: true
      }
    ];

    function ensurePremiumCookies(items) {
      const list = Array.isArray(items) ? items.slice() : [];
      const missing = PREMIUM_COOKIES.filter((cookie) =>
        !list.some((item) =>
          item.id === cookie.id || (item.name || '').trim().toLowerCase() === cookie.name.toLowerCase()
        )
      );
      return missing.length ? [...list, ...missing] : list;
    }

    let menuItems = [];
    try {
      menuItems = JSON.parse(localStorage.getItem('akeopi_pos_menu_v1') || '[]');
    } catch (e) {}
    if (!Array.isArray(menuItems)) menuItems = [];

    if (!menuItems.length) {
      const coffeeAddons = [{ name: 'Espresso Shot', price: 35 }, { name: 'Flavored Syrup', price: 15 }, { name: 'Whipcream', price: 25 }];
      const mealAddons = [{ name: 'Spam', price: 20 }, { name: 'Egg', price: 20 }, { name: 'Rice', price: 25 }];
      menuItems = [
        { id: 'coffee-1', name: 'Americano', category: 'Coffee', variants: [{label:'12oz',price:89},{label:'16oz',price:109}], addons: coffeeAddons, available:true },
        { id: 'coffee-2', name: 'Cafe Latte', category: 'Coffee', variants: [{label:'12oz',price:109},{label:'16oz',price:129}], addons: coffeeAddons, available:true },
        { id: 'coffee-3', name: 'Cappuccino', category: 'Coffee', variants: [{label:'12oz',price:109},{label:'16oz',price:129}], addons: coffeeAddons, available:true },
        { id: 'coffee-4', name: 'Spanish Latte', category: 'Coffee', variants: [{label:'12oz',price:119},{label:'16oz',price:139}], addons: coffeeAddons, available:true },
        { id: 'frappe-1', name: 'Mocha Frappe', category: 'Frappe', variants: [{label:'16oz',price:139}], addons: coffeeAddons, available:true },
        { id: 'frappe-2', name: 'Caramel Frappe', category: 'Frappe', variants: [{label:'16oz',price:139}], addons: coffeeAddons, available:true },
        { id: 'rice-1', name: 'Chicken Inasal', category: 'Rice Meals', variants: [{label:'Regular',price:149}], addons: mealAddons, available:true },
        { id: 'rice-2', name: 'Pork Sisig', category: 'Rice Meals', variants: [{label:'Regular',price:159}], addons: mealAddons, available:true }
      ];
    }

    menuItems = ensurePremiumCookies(menuItems);

    let cart = [];
    let orderType = 'Dine-In';
    let selectedItem = null;
    let selectedVariant = null;
    let selectedAddons = new Set();
    let activeCategory = 'All';
    let menuSearch = '';
    let storeHours = { open: '10:00', close: '22:00' };

    function isValidTimeValue(value) {
      return typeof value === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(value);
    }

    function storeHoursToMinutes(value) {
      const [hour, minute] = String(value).split(':').map(Number);
      return hour * 60 + minute;
    }

    function formatStoreTime(value) {
      if (!isValidTimeValue(value)) return '';
      const [hour, minute] = value.split(':').map(Number);
      const suffix = hour >= 12 ? 'PM' : 'AM';
      const hour12 = hour % 12 === 0 ? 12 : hour % 12;
      return `${hour12}:${String(minute).padStart(2, '0')} ${suffix}`;
    }

    function isStoreOpen() {
      const parts = new Intl.DateTimeFormat('en-PH', {
        timeZone: 'Asia/Manila',
        hour: '2-digit',
        minute: '2-digit',
        hourCycle: 'h23'
      }).formatToParts(new Date());
      const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      const minutesNow = Number(values.hour) * 60 + Number(values.minute);
      const openMinutes = storeHoursToMinutes(storeHours.open);
      const closeMinutes = storeHoursToMinutes(storeHours.close);
      if (openMinutes === closeMinutes) return true;
      if (closeMinutes > openMinutes) return minutesNow >= openMinutes && minutesNow < closeMinutes;
      return minutesNow >= openMinutes || minutesNow < closeMinutes;
    }

    function updateStoreStatus() {
      const open = isStoreOpen();
      const banner = document.getElementById('store-hours-banner');
      const status = document.getElementById('store-status');
      const hoursText = document.getElementById('store-hours-text');
      const placeButton = document.getElementById('place-order');

      banner.className = open
        ? 'mb-3 rounded-2xl border border-[#D8B55A] bg-[#FFF9E8] px-4 py-3 text-center text-[#7A5A12]'
          : 'mb-3 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-center text-red-700';
      status.textContent = open ? '🟢 Store is Open — Accepting Orders' : '🔴 Store is Closed — Ordering Paused';
      if (hoursText) hoursText.textContent = `Open daily: ${formatStoreTime(storeHours.open)} – ${formatStoreTime(storeHours.close)}`;
      placeButton.disabled = !open || cart.length === 0;
    }

    firebase.auth().onAuthStateChanged((user) => {
      if (!user) return;
      db.collection('settings').doc('customerMenu').onSnapshot((snapshot) => {
        if (!snapshot.exists) return;
        const data = snapshot.data() || {};
        if (isValidTimeValue(data.storeOpen) && isValidTimeValue(data.storeClose)) {
          storeHours = { open: data.storeOpen, close: data.storeClose };
          updateStoreStatus();
        }
        const remoteItems = data.items;
        if (!Array.isArray(remoteItems)) return;

        menuItems = ensurePremiumCookies(remoteItems);
        localStorage.setItem('akeopi_pos_menu_v1', JSON.stringify(menuItems));

        cart = cart.map((cartItem) => {
          const menuItem = remoteItems.find((item) => item.id === cartItem.itemId || item.name === cartItem.name);
          if (!menuItem) return cartItem;
          const variant = (menuItem.variants || []).find((item) => item.label === cartItem.variantLabel);
          return variant
            ? {
              ...cartItem,
              basePrice: Number(variant.price),
              unitPrice: Number(variant.price) + (cartItem.addons || []).reduce((sum, addon) => sum + Number(addon.price), 0),
              category: menuItem.category
            }
            : cartItem;
        });

        renderMenu();
        renderCart();
      }, (error) => console.error('Menu sync failed:', error));
    });

    function setOrderType(type) {
      orderType = type;
    }

    function renderMenu() {
      const list = document.getElementById('menu-list');
      const availableItems = menuItems.filter((item) => item.available !== false && Array.isArray(item.variants) && item.variants.length);
      const categories = [...new Set(availableItems.map((item) => item.category || 'Other'))];
      if (activeCategory !== 'All' && !categories.includes(activeCategory)) activeCategory = 'All';
      document.getElementById('menu-categories').innerHTML = ['All', ...categories].map((category) =>
        `<button type="button" onclick="selectMenuCategory('${category.replace(/'/g, "\\'")}')" aria-pressed="${category === activeCategory}"
          class="shrink-0 rounded-full border px-3 py-2 text-xs font-bold ${category === activeCategory ? 'border-[#133824] bg-[#133824] text-white' : 'border-stone-300 bg-white text-stone-700'}">${category}</button>`
      ).join('');

      const filtered = availableItems.filter((item) => {
        const matchesCategory = activeCategory === 'All' || item.category === activeCategory;
        const query = menuSearch.trim().toLowerCase();
        const matchesSearch = !query || item.name.toLowerCase().includes(query) || (item.category || '').toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });
      if (!filtered.length) {
        list.innerHTML = '<p class="rounded-2xl border border-dashed border-stone-300 bg-white p-8 text-center text-sm text-stone-500">No menu items found. Try another search or category.</p>';
        return;
      }

      const visibleCategories = activeCategory === 'All' ? [...new Set(filtered.map((item) => item.category || 'Other'))] : [activeCategory];
      list.innerHTML = visibleCategories.map((category) => {
        const categoryItems = filtered.filter((item) => (item.category || 'Other') === category);
        const cards = categoryItems.map((item) => {
        const prices = item.variants.map((v) => Number(v.price));
        const price = Math.min(...prices) === Math.max(...prices)
          ? `₱${Math.min(...prices)}`
          : `₱${Math.min(...prices)}–₱${Math.max(...prices)}`;
        return `<button type="button" onclick="openItemModal('${item.id}')"
          class="flex min-w-0 flex-col rounded-2xl border border-stone-200 bg-white p-3 text-left shadow-sm transition hover:border-[#C9A84D]">
          <h3 class="mt-1 min-h-10 text-sm font-extrabold break-words">${item.name}</h3>
          ${item.description ? `<p class="mt-1 line-clamp-3 text-[11px] leading-snug text-stone-500 break-words">${item.description}</p>` : ''}
          <p class="mt-2 whitespace-nowrap text-sm font-extrabold text-[#A77D1D]">${price}</p>
        </button>`;
        }).join('');
        return `<div><h2 class="mb-2 text-lg font-extrabold text-[#133824]">${category}</h2><div class="grid grid-cols-2 gap-2 sm:grid-cols-3">${cards}</div></div>`;
      }).join('');
    }

    function selectMenuCategory(category) {
      activeCategory = category;
      renderMenu();
    }

    function setMenuSearch(value) {
      menuSearch = value;
      renderMenu();
    }

    function renderAddons() {
      const addons = Array.isArray(selectedItem.addons) ? selectedItem.addons : [];
      const list = document.getElementById('addon-list');
      list.innerHTML = addons.length
        ? `<p class="text-xs font-extrabold">Add-ons <span class="font-normal text-stone-500">(Optional)</span></p>${addons.map((addon, index) => `
          <label class="flex cursor-pointer items-center justify-between rounded-xl border border-stone-200 px-3 py-2 text-sm">
            <span class="flex items-center gap-2"><input type="checkbox" onchange="toggleAddon(${index})" ${selectedAddons.has(index) ? 'checked' : ''} class="accent-[#C9A84D]"><span>${addon.name}</span></span>
            <span class="font-bold text-[#A77D1D]">+₱${addon.price}</span>
          </label>`).join('')}`
        : '';
    }

    function toggleAddon(index) {
      if (selectedAddons.has(index)) selectedAddons.delete(index);
      else selectedAddons.add(index);
      updateSelectedItemPrice();
    }

    function updateSelectedItemPrice() {
      const basePrice = Number(selectedItem.variants[selectedVariant].price);
      const addonPrice = Array.from(selectedAddons).reduce((sum, index) => sum + Number(selectedItem.addons[index].price), 0);
      document.getElementById('add-item-button').textContent = `Add to Order • ₱${(basePrice + addonPrice).toFixed(2)}`;
    }

    function openItemModal(itemId) {
      selectedItem = menuItems.find((item) => item.id === itemId);
      if (!selectedItem) return;
      selectedVariant = 0;
      selectedAddons = new Set();
      document.getElementById('item-category').textContent = selectedItem.category;
      document.getElementById('item-name').textContent = selectedItem.name;
      document.getElementById('item-description').textContent = selectedItem.description || '';
      document.getElementById('variant-list').innerHTML = selectedItem.variants.map((variant, index) =>
        `<button type="button" onclick="selectVariant(${index})" id="variant-${index}"
          class="flex w-full items-center justify-between gap-2 rounded-xl border px-3 py-2.5 text-sm ${index === 0 ? 'border-[#C9A84D] bg-[#FFF9E8] font-bold' : 'border-stone-300'}">
          <span class="min-w-0 break-words">${variant.label}</span><span class="shrink-0 whitespace-nowrap">₱${variant.price}</span>
        </button>`
      ).join('');
      renderAddons();
      updateSelectedItemPrice();
      const modal = document.getElementById('item-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function selectVariant(index) {
      selectedVariant = index;
      selectedItem.variants.forEach((_, i) => {
        const button = document.getElementById(`variant-${i}`);
        button.className = i === index
          ? 'flex w-full items-center justify-between gap-2 rounded-xl border border-[#C9A84D] bg-[#FFF9E8] px-3 py-2.5 text-sm font-bold'
          : 'flex w-full items-center justify-between gap-2 rounded-xl border border-stone-300 px-3 py-2.5 text-sm';
      });
      updateSelectedItemPrice();
    }

    function closeItemModal() {
      document.getElementById('item-modal').classList.add('hidden');
      document.getElementById('item-modal').classList.remove('flex');
    }

    function addSelectedItem() {
      const variant = selectedItem.variants[selectedVariant];
      const addons = Array.from(selectedAddons).map((index) => selectedItem.addons[index]);
      const addonKey = addons.map((addon) => addon.name).sort().join('|');
      const existing = cart.find((item) => item.itemId === selectedItem.id && item.variantLabel === variant.label && item.addonKey === addonKey);
      const basePrice = Number(variant.price);
      const unitPrice = basePrice + addons.reduce((sum, addon) => sum + Number(addon.price), 0);
      if (existing) existing.qty += 1;
      else cart.push({ itemId: selectedItem.id, name: selectedItem.name, category: selectedItem.category, variantLabel: variant.label, basePrice, addons, addonKey, unitPrice, qty: 1 });
      closeItemModal();
      renderCart();
    }

    function renderCart() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      const total = cart.reduce((sum, item) => sum + item.unitPrice * item.qty, 0);
      document.getElementById('cart-count').textContent = count;
      document.getElementById('cart-total').textContent = total.toFixed(2);
      document.getElementById('place-order').disabled = cart.length === 0 || !isStoreOpen();
      document.getElementById('cart-items').innerHTML = cart.length
        ? cart.map((item, index) => `
          <div class="flex items-center justify-between gap-2 rounded-xl border border-stone-200 p-3">
            <div class="min-w-0"><p class="text-sm font-bold break-words">${item.name}</p><p class="text-xs text-stone-500 break-words">${item.variantLabel} • ₱${item.unitPrice} each</p>${item.addons && item.addons.length ? `<p class="text-xs text-stone-500 break-words">Add-ons: ${item.addons.map((addon) => `${addon.name} (+₱${addon.price})`).join(', ')}</p>` : ''}</div>
            <div class="flex shrink-0 items-center gap-2">
              <button type="button" onclick="changeQty(${index},-1)" class="h-8 w-8 rounded-lg bg-stone-100">−</button>
              <span class="text-sm font-bold">${item.qty}</span>
              <button type="button" onclick="changeQty(${index},1)" class="h-8 w-8 rounded-lg bg-stone-100">+</button>
            </div>
          </div>`).join('')
        : '<p class="py-8 text-center text-sm text-stone-400">Your order is empty</p>';
    }

    function changeQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      renderCart();
    }

    function toggleCart(open) {
      const panel = document.getElementById('cart-panel');
      if (typeof open === 'boolean') {
        panel.classList.toggle('hidden', !open);
        panel.classList.toggle('flex', open);
      } else {
        panel.classList.toggle('hidden');
        panel.classList.toggle('flex');
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2600);
    }

    function generateOrderCode() {
      return String(Math.floor(1000 + Math.random() * 9000));
    }

    function closeOrderConfirmation() {
      const confirmation = document.getElementById('order-confirmation');
      confirmation.classList.add('hidden');
      confirmation.classList.remove('flex');
    }

    async function placeOrder() {
      if (!isStoreOpen()) {
        showToast(`Store is closed. Ordering resumes at ${formatStoreTime(storeHours.open)}.`);
        updateStoreStatus();
        return;
      }
      const name = document.getElementById('customer-name').value.trim();
      if (!name) {
        showToast('Please enter your name');
        document.getElementById('customer-name').focus();
        return;
      }
      if (!cart.length) return;
      const button = document.getElementById('place-order');
      button.disabled = true;
      const subtotal = cart.reduce((sum, item) => sum + item.unitPrice * item.qty, 0);
      const orderCode = generateOrderCode();
      try {
        await db.collection('orders').add({
          orderCode,
          customerName: name,
          customerContact: '',
          customerAddress: '',
          fulfillment: orderType,
          orderType,
          items: JSON.parse(JSON.stringify(cart)),
          subtotal,
          deliveryFee: 0,
          total: subtotal,
          paymentMethod: document.getElementById('payment-method').value,
          status: 'pending',
          source: 'customer',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        cart = [];
        renderCart();
        document.getElementById('customer-name').value = '';
        document.getElementById('payment-method').value = '';
        document.getElementById('order-dinein').checked = true;
        document.getElementById('order-takeout').checked = false;
        setOrderType('Dine-In');
        toggleCart(false);
        document.getElementById('order-confirmation-code').textContent = orderCode;
        const confirmation = document.getElementById('order-confirmation');
        confirmation.classList.remove('hidden');
        confirmation.classList.add('flex');
      } catch (error) {
        console.error(error);
        showToast('Unable to send order. Please try again.');
      } finally {
        button.disabled = cart.length === 0;
      }
    }

    renderMenu();
    renderCart();
    updateStoreStatus();
    setInterval(updateStoreStatus, 30000);
  </script>
</body>
</html>
