<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A.Keopi Cafe - Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#FFFDF8] text-[#2F2A21]">
  <main class="mx-auto min-h-screen max-w-3xl p-3 pb-32 sm:p-5">
    <header class="mb-4 flex items-center gap-3 rounded-2xl border border-[#D8B55A] bg-white p-4 text-[#2F2A21] shadow-lg">
      <div class="flex h-11 w-11 shrink-0 items-center justify-center overflow-hidden rounded-xl bg-white p-1">
        <img src="./A-keopicafe-logo.jpg" alt="A.Keopi Cafe logo" class="h-full w-full object-contain">
      </div>
      <div>
        <h1 class="font-serif text-xl font-extrabold">A.Keopi Cafe</h1>
        <p class="text-xs text-[#A77D1D]">Customer Ordering</p>
      </div>
    </header>

    <div id="store-hours-banner" class="mb-3 rounded-2xl border px-4 py-3 text-center">
      <p id="store-status" class="text-sm font-extrabold"></p>
      <p class="mt-0.5 text-xs text-stone-500">Open daily: 10:00 AM – 10:00 PM</p>
      <a
        href="https://www.google.com/maps/search/?api=1&query=Beside%20RAMDC%20Concordia%20along%20highway%2C%20Bolinao%2C%20Pangasinan%2C%20Philippines%202406"
        target="_blank"
        rel="noopener"
        class="mt-2 inline-block text-xs font-bold text-[#A77D1D] underline"
      >
        📍 Beside RAMDC Concordia along highway, Bolinao, Pangasinan, Philippines, 2406
      </a>
    </div>

    <section class="mb-3 rounded-2xl bg-white p-3 shadow">
      <div class="grid gap-3 sm:grid-cols-2">
        <label class="block text-xs font-extrabold">Customer Name *
          <input id="customer-name" class="mt-1 w-full rounded-xl border border-stone-300 px-3 py-2.5 text-sm outline-none focus:border-[#C9A84D] focus:ring-2 focus:ring-[#C9A84D]/30" placeholder="Enter your name" autocomplete="name">
        </label>
        <label id="customer-contact-wrap" class="hidden text-xs font-extrabold">Contact Number *
          <input id="customer-contact" type="tel" inputmode="tel" class="mt-1 w-full rounded-xl border border-stone-300 px-3 py-2.5 text-sm outline-none focus:border-[#C9A84D] focus:ring-2 focus:ring-[#C9A84D]/30" placeholder="09XXXXXXXXX" autocomplete="tel">
        </label>
      </div>
      <fieldset class="mt-3">
        <legend class="mb-1 text-xs font-extrabold">Order Type *</legend>
        <div class="grid grid-cols-2 gap-2">
          <label class="flex cursor-pointer items-center gap-2 rounded-xl border border-stone-300 px-3 py-2.5 text-sm font-bold">
            <input id="order-dinein" type="radio" name="order-type" value="Dine-In" checked onchange="setOrderType('Dine-In')" class="accent-[#C9A84D]">
            <span>🍽️ Dine-In</span>
          </label>
          <label class="flex cursor-pointer items-center gap-2 rounded-xl border border-stone-300 px-3 py-2.5 text-sm font-bold">
            <input id="order-takeout" type="radio" name="order-type" value="Take-Out" onchange="setOrderType('Take-Out')" class="accent-[#C9A84D]">
            <span>🛍️ Take-Out</span>
          </label>
          <label class="flex cursor-pointer items-center gap-2 rounded-xl border border-stone-300 px-3 py-2.5 text-sm font-bold">
            <input id="order-pickup" type="radio" name="order-type" value="Pick-Up" onchange="setOrderType('Pick-Up')" class="accent-[#C9A84D]">
            <span>📦 Pick-Up</span>
          </label>
          <label class="flex cursor-pointer items-center gap-2 rounded-xl border border-stone-300 px-3 py-2.5 text-sm font-bold">
            <input id="order-delivery" type="radio" name="order-type" value="Delivery" onchange="setOrderType('Delivery')" class="accent-[#C9A84D]">
            <span>🛵 Delivery</span>
          </label>
        </div>
      </fieldset>
      <label id="delivery-address-wrap" class="mt-3 hidden text-xs font-extrabold">Delivery Address *
        <input id="customer-address" class="mt-1 w-full rounded-xl border border-stone-300 px-3 py-2.5 text-sm outline-none focus:border-[#C9A84D] focus:ring-2 focus:ring-[#C9A84D]/30" placeholder="House / Street / Barangay">
      </label>
    </section>

    <section id="menu-list" class="grid grid-cols-2 gap-2 sm:grid-cols-3"></section>
  </main>

  <aside class="fixed inset-x-0 bottom-0 z-40 border-t border-stone-200 bg-white p-3 shadow-[0_-8px_30px_rgba(0,0,0,.12)]">
    <div class="mx-auto flex max-w-3xl items-center gap-3">
      <div class="min-w-0 flex-1">
        <p class="text-xs text-stone-500"><span id="cart-count">0</span> item(s)</p>
        <p class="text-lg font-extrabold text-[#133824]">₱<span id="cart-total">0.00</span></p>
      </div>
      <button id="cart-toggle" type="button" onclick="toggleCart()" class="rounded-xl border border-stone-300 px-4 py-3 text-sm font-bold">View Order</button>
      <button id="place-order" type="button" onclick="placeOrder()" class="rounded-xl border border-[#C9A84D] bg-[#C9A84D] px-5 py-3 text-sm font-extrabold text-white disabled:opacity-40" disabled>Place Order</button>
    </div>
  </aside>

  <div id="cart-panel" class="fixed inset-0 z-50 hidden items-end bg-black/50">
    <div class="max-h-[75vh] w-full overflow-y-auto rounded-t-3xl bg-white p-4">
      <div class="mb-3 flex items-center justify-between">
        <h2 class="font-extrabold">Your Order</h2>
        <button type="button" onclick="toggleCart(false)" class="rounded-lg px-3 py-2 text-sm">Close</button>
      </div>
      <div id="cart-items" class="space-y-2"></div>
    </div>
  </div>

  <div id="item-modal" class="fixed inset-0 z-[60] hidden items-end bg-black/50 sm:items-center sm:justify-center sm:p-4">
    <div class="w-full max-w-md rounded-t-3xl bg-white p-4 sm:rounded-3xl">
      <div class="mb-3 flex items-start justify-between">
        <div>
          <p id="item-category" class="text-[10px] font-bold uppercase text-[#1C4B32]"></p>
          <h2 id="item-name" class="font-extrabold"></h2>
        </div>
        <button type="button" onclick="closeItemModal()" class="rounded-lg px-3 py-2">×</button>
      </div>
      <div id="variant-list" class="space-y-2"></div>
      <button type="button" onclick="addSelectedItem()" class="mt-4 w-full rounded-xl border border-[#C9A84D] bg-[#C9A84D] py-3 text-sm font-extrabold text-white">Add to Order</button>
    </div>
  </div>

  <div id="toast" class="fixed left-1/2 top-4 z-[70] hidden -translate-x-1/2 rounded-xl border border-[#C9A84D] bg-[#7A5A12] px-4 py-2.5 text-sm font-bold text-white shadow-lg"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCKyxAyc7wrDRCDhMrOKT50JYq4zj_wZow",
      authDomain: "akeopicafe-order.firebaseapp.com",
      projectId: "akeopicafe-order",
      storageBucket: "akeopicafe-order.firebasestorage.app",
      messagingSenderId: "43301188783",
      appId: "1:43301188783:web:483fadd21a8c7d7e99905a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    firebase.auth().signInAnonymously().catch((error) => console.error(error));

    let menuItems = [];
    try {
      menuItems = JSON.parse(localStorage.getItem('akeopi_pos_menu_v1') || '[]');
    } catch (e) {}

    if (!menuItems.length) {
      menuItems = [
        { id: 'coffee-1', name: 'Americano', category: 'Coffee', variants: [{label:'12oz',price:89},{label:'16oz',price:109}], available:true },
        { id: 'coffee-2', name: 'Cafe Latte', category: 'Coffee', variants: [{label:'12oz',price:109},{label:'16oz',price:129}], available:true },
        { id: 'coffee-3', name: 'Cappuccino', category: 'Coffee', variants: [{label:'12oz',price:109},{label:'16oz',price:129}], available:true },
        { id: 'coffee-4', name: 'Spanish Latte', category: 'Coffee', variants: [{label:'12oz',price:119},{label:'16oz',price:139}], available:true },
        { id: 'frappe-1', name: 'Mocha Frappe', category: 'Frappe', variants: [{label:'16oz',price:139}], available:true },
        { id: 'frappe-2', name: 'Caramel Frappe', category: 'Frappe', variants: [{label:'16oz',price:139}], available:true },
        { id: 'rice-1', name: 'Chicken Inasal', category: 'Rice Meals', variants: [{label:'Regular',price:149}], available:true },
        { id: 'rice-2', name: 'Pork Sisig', category: 'Rice Meals', variants: [{label:'Regular',price:159}], available:true }
      ];
    }

    let cart = [];
    let orderType = 'Dine-In';
    let selectedItem = null;
    let selectedVariant = null;

    function isStoreOpen() {
      const parts = new Intl.DateTimeFormat('en-PH', {
        timeZone: 'Asia/Manila',
        hour: '2-digit',
        minute: '2-digit',
        hourCycle: 'h23'
      }).formatToParts(new Date());
      const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      const minutesNow = Number(values.hour) * 60 + Number(values.minute);
      return minutesNow >= 10 * 60 && minutesNow < 22 * 60;
    }

    function updateStoreStatus() {
      const open = isStoreOpen();
      const banner = document.getElementById('store-hours-banner');
      const status = document.getElementById('store-status');
      const placeButton = document.getElementById('place-order');

      banner.className = open
        ? 'mb-3 rounded-2xl border border-[#D8B55A] bg-[#FFF9E8] px-4 py-3 text-center text-[#7A5A12]'
          : 'mb-3 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-center text-red-700';
      status.textContent = open ? '🟢 Store is Open — Accepting Orders' : '🔴 Store is Closed — Ordering Paused';
      placeButton.disabled = !open || cart.length === 0;
    }

    firebase.auth().onAuthStateChanged((user) => {
      if (!user) return;
      db.collection('settings').doc('customerMenu').onSnapshot((snapshot) => {
        if (!snapshot.exists) return;
        const remoteItems = snapshot.data().items;
        if (!Array.isArray(remoteItems)) return;

        menuItems = remoteItems;
        localStorage.setItem('akeopi_pos_menu_v1', JSON.stringify(menuItems));

        cart = cart.map((cartItem) => {
          const menuItem = remoteItems.find((item) => item.name === cartItem.name);
          if (!menuItem) return cartItem;
          const variant = (menuItem.variants || []).find((item) => item.label === cartItem.variantLabel);
          return variant
            ? { ...cartItem, unitPrice: Number(variant.price), category: menuItem.category }
            : cartItem;
        });

        renderMenu();
        renderCart();
      }, (error) => console.error('Menu sync failed:', error));
    });

    function setOrderType(type) {
      orderType = type;
      const needsContact = type === 'Pick-Up' || type === 'Delivery';
      document.getElementById('customer-contact-wrap').classList.toggle('hidden', !needsContact);
      if (!needsContact) document.getElementById('customer-contact').value = '';
      document.getElementById('delivery-address-wrap').classList.toggle('hidden', type !== 'Delivery');
    }

    function renderMenu() {
      const list = document.getElementById('menu-list');
      list.innerHTML = menuItems.filter((item) => item.available !== false).map((item) => {
        const prices = item.variants.map((v) => v.price);
        const price = Math.min(...prices) === Math.max(...prices)
          ? `₱${Math.min(...prices)}`
          : `₱${Math.min(...prices)}–₱${Math.max(...prices)}`;
        return `<button type="button" onclick="openItemModal('${item.id}')"
          class="rounded-2xl border border-stone-200 bg-white p-3 text-left shadow-sm">
          <p class="truncate text-[10px] font-bold uppercase text-[#1C4B32]">${item.category}</p>
          <h3 class="mt-1 min-h-10 text-sm font-extrabold">${item.name}</h3>
          <p class="mt-2 text-sm font-extrabold text-[#A77D1D]">${price}</p>
        </button>`;
      }).join('');
    }

    function openItemModal(itemId) {
      selectedItem = menuItems.find((item) => item.id === itemId);
      if (!selectedItem) return;
      selectedVariant = 0;
      document.getElementById('item-category').textContent = selectedItem.category;
      document.getElementById('item-name').textContent = selectedItem.name;
      document.getElementById('variant-list').innerHTML = selectedItem.variants.map((variant, index) =>
        `<button type="button" onclick="selectVariant(${index})" id="variant-${index}"
          class="flex w-full items-center justify-between rounded-xl border px-3 py-2.5 text-sm ${index === 0 ? 'border-[#C9A84D] bg-[#FFF9E8] font-bold' : 'border-stone-300'}">
          <span>${variant.label}</span><span>₱${variant.price}</span>
        </button>`
      ).join('');
      const modal = document.getElementById('item-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function selectVariant(index) {
      selectedVariant = index;
      selectedItem.variants.forEach((_, i) => {
        const button = document.getElementById(`variant-${i}`);
        button.className = i === index
          ? 'flex w-full items-center justify-between rounded-xl border border-[#C9A84D] bg-[#FFF9E8] px-3 py-2.5 text-sm font-bold'
          : 'flex w-full items-center justify-between rounded-xl border border-stone-300 px-3 py-2.5 text-sm';
      });
    }

    function closeItemModal() {
      document.getElementById('item-modal').classList.add('hidden');
      document.getElementById('item-modal').classList.remove('flex');
    }

    function addSelectedItem() {
      const variant = selectedItem.variants[selectedVariant];
      const existing = cart.find((item) => item.name === selectedItem.name && item.variantLabel === variant.label);
      if (existing) existing.qty += 1;
      else cart.push({ name: selectedItem.name, category: selectedItem.category, variantLabel: variant.label, unitPrice: variant.price, qty: 1 });
      closeItemModal();
      renderCart();
    }

    function renderCart() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      const total = cart.reduce((sum, item) => sum + item.unitPrice * item.qty, 0);
      document.getElementById('cart-count').textContent = count;
      document.getElementById('cart-total').textContent = total.toFixed(2);
      document.getElementById('place-order').disabled = cart.length === 0 || !isStoreOpen();
      document.getElementById('cart-items').innerHTML = cart.length
        ? cart.map((item, index) => `
          <div class="flex items-center justify-between rounded-xl border border-stone-200 p-3">
            <div><p class="text-sm font-bold">${item.name}</p><p class="text-xs text-stone-500">${item.variantLabel} • ₱${item.unitPrice}</p></div>
            <div class="flex items-center gap-2">
              <button type="button" onclick="changeQty(${index},-1)" class="h-8 w-8 rounded-lg bg-stone-100">−</button>
              <span class="text-sm font-bold">${item.qty}</span>
              <button type="button" onclick="changeQty(${index},1)" class="h-8 w-8 rounded-lg bg-stone-100">+</button>
            </div>
          </div>`).join('')
        : '<p class="py-8 text-center text-sm text-stone-400">Your order is empty</p>';
    }

    function changeQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      renderCart();
    }

    function toggleCart(open) {
      const panel = document.getElementById('cart-panel');
      if (typeof open === 'boolean') {
        panel.classList.toggle('hidden', !open);
        panel.classList.toggle('flex', open);
      } else {
        panel.classList.toggle('hidden');
        panel.classList.toggle('flex');
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2600);
    }

    async function placeOrder() {
      if (!isStoreOpen()) {
        showToast('Store is closed. Ordering resumes at 10:00 AM.');
        updateStoreStatus();
        return;
      }
      const name = document.getElementById('customer-name').value.trim();
      const contact = document.getElementById('customer-contact').value.trim();
      const address = document.getElementById('customer-address').value.trim();
      if (!name) {
        showToast('Please enter your name');
        document.getElementById('customer-name').focus();
        return;
      }
      if ((orderType === 'Pick-Up' || orderType === 'Delivery') && !contact) {
        showToast('Please enter your contact number');
        document.getElementById('customer-contact').focus();
        return;
      }
      if (orderType === 'Delivery' && !address) {
        showToast('Please enter your delivery address');
        document.getElementById('customer-address').focus();
        return;
      }
      if (!cart.length) return;
      const button = document.getElementById('place-order');
      button.disabled = true;
      const subtotal = cart.reduce((sum, item) => sum + item.unitPrice * item.qty, 0);
      try {
        await db.collection('orders').add({
          customerName: name,
          customerContact: (orderType === 'Pick-Up' || orderType === 'Delivery') ? contact : '',
          customerAddress: orderType === 'Delivery' ? address : '',
          fulfillment: orderType,
          orderType,
          items: JSON.parse(JSON.stringify(cart)),
          subtotal,
          deliveryFee: 0,
          total: subtotal,
          status: 'pending',
          source: 'customer',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        cart = [];
        renderCart();
        document.getElementById('customer-name').value = '';
        document.getElementById('customer-contact').value = '';
        document.getElementById('customer-address').value = '';
        document.getElementById('order-dinein').checked = true;
        document.getElementById('order-takeout').checked = false;
        document.getElementById('order-pickup').checked = false;
        document.getElementById('order-delivery').checked = false;
        setOrderType('Dine-In');
        toggleCart(false);
        showToast('Order sent! Please wait for confirmation.');
      } catch (error) {
        console.error(error);
        showToast('Unable to send order. Please try again.');
      } finally {
        button.disabled = cart.length === 0;
      }
    }

    renderMenu();
    renderCart();
  </script>
</body>
</html>
